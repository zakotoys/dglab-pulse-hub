appId: com.zakotoys.dglab-pulse-hub
productName: DGLab Pulse Hub
artifactName: DGLab Pulse Hub Setup.exe
directories:
  app: .
  output: out/make/nsis
files:
  - dist/**
  - package.json
  - assets/**
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: assets/dglab-pulse-hub-icon.ico
  executableName: DGLab Pulse Hub
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DGLab Pulse Hub
  include: installer.nsh
