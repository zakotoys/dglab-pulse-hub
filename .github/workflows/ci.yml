name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting, types, tests, and builds
        run: npm run check

      - name: Package desktop application
        run: npm --workspace @dglab-pulse-hub/desktop run make

      - name: Validate corpus tools
        run: |
          npm run corpus:report -- --json
          npm run corpus:verify -- tests/fixtures --json

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Verify public readiness endpoint
        run:
          curl --fail --show-error --retry 5 --retry-all-errors http://127.0.0.1:8080/health/ready

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20
