name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check formatting, types, tests, and builds
        run: npm run check

      - name: Package desktop application
        run: npm --workspace @dglab-pulse-hub/desktop run make

      - name: Validate corpus tools
        run: |
          npm run corpus:report -- --json
          npm run corpus:verify -- tests/fixtures --json

  desktop-artifacts:
    name: Desktop artifact (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            forge_platform: win32
            runner: windows-latest
          - platform: macos
            forge_platform: darwin
            runner: macos-latest
          - platform: linux
            forge_platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build desktop installers and archives
        run: >-
          npm run desktop:make -- --platform=${{ matrix.forge_platform }} --arch=x64

      - name: Upload desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Verify public readiness endpoint
        run:
          curl --fail --show-error --retry 5 --retry-all-errors http://127.0.0.1:8080/health/ready

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20
