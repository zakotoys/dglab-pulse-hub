name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check formatting, types, tests, and builds
        run: npm run check

      - name: Package desktop application
        run: npm --workspace @dglab-pulse-hub/desktop run make

      - name: Validate corpus tools
        run: |
          npm run corpus:report -- --json
          npm run corpus:verify -- tests/fixtures --json

  desktop-artifacts:
    name: Desktop artifact (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            forge_platform: win32
            runner: windows-latest
          - platform: macos
            forge_platform: darwin
            runner: macos-latest
          - platform: linux
            forge_platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Linux packaging tools
        if: matrix.forge_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends rpm

      - name: Build desktop installers and archives
        run: >-
          npm run desktop:make -- --platform=${{ matrix.forge_platform }} --arch=x64

      - name: Audit packaged desktop runtime
        shell: bash
        env:
          CI_FORGE_PLATFORM: ${{ matrix.forge_platform }}
        run: |
          package_dir="apps/desktop/out/DGLab Pulse Hub-${CI_FORGE_PLATFORM}-x64"
          npm run desktop:audit-package -- "$CI_FORGE_PLATFORM" x64 "$package_dir"
          if [ "$CI_FORGE_PLATFORM" = linux ]; then
            builder_dir="apps/desktop/out/make/builder/linux-unpacked"
            npm run desktop:audit-package -- "$CI_FORGE_PLATFORM" x64 "$builder_dir"
            package_dir="apps/desktop/out/make/builder"
            appimage="$(find "$package_dir" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
            deb="$(find "$package_dir" -maxdepth 1 -type f -name '*.deb' -print -quit)"
            rpm="$(find "$package_dir" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
            test "$(stat --format=%s "$appimage")" -gt 1000000
            test "$(stat --format=%s "$deb")" -gt 1000000
            test "$(stat --format=%s "$rpm")" -gt 1000000
            test "$(dpkg-deb --field "$deb" Package)" = dglab-pulse-hub
            test "$(dpkg-deb --field "$deb" Architecture)" = amd64
            test "$(rpm --query --package --queryformat '%{NAME}' "$rpm")" = dglab-pulse-hub
            test "$(rpm --query --package --queryformat '%{ARCH}' "$rpm")" = x86_64
          fi

      - name: Upload desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Verify public readiness endpoint
        run:
          curl --fail --show-error --retry 5 --retry-all-errors http://127.0.0.1:8080/health/ready

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20
