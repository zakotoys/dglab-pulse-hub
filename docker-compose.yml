services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      PULSE_API_HOST: 0.0.0.0
      PULSE_API_PORT: 8787
    expose:
      - '8787'
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8787/health/ready') .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: web
    expose:
      - '8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${PULSE_HUB_PORT:-8080}:8080'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health/ready']
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
